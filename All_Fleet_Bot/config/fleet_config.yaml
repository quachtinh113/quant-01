# =====================================================================
# UNIFIED QUANT FLEET — Configuration
# 1 PC running 5 Quant Bot Strategies simultaneously on MT5
# =====================================================================

system:
  execution_mode: "live"         # "live" (send real orders) or "paper" / "shadow" (log only)
  loop_interval_seconds: 15       # Master loop polling frequency in seconds
  timezone: "UTC"
  log_level: "INFO"
  log_dir: "logs"

account_risk_guard:
  # ===================================================================
  # 🎯 DAILY CIRCUIT BREAKER & PROFIT LOCK ARCHITECTURE (TARGET: $13/DAY)
  # ===================================================================
  daily_profit_target_usd: 20.0   # Daily profit lock: Lock in profit and halt opening when +$20.00 is achieved
  daily_profit_target_pct: 0.20   # ~0.20% equity profit target on $10,000
  max_daily_drawdown_usd: 15.0    # Hard Daily Circuit Breaker: Halt all trading if loss reaches -$15.00/day
  max_daily_loss_pct: 0.15        # Hard kill-switch at -0.15% daily loss (-$15.00)
  max_total_open_risk_pct: 1.0    # Strict risk ceiling (1.0% max total open risk)
  min_margin_level_percent: 300.0 # Strict margin buffer (Halt new trades if margin < 300%)
  max_total_open_positions: 3     # Focus strictly on max 3 high-conviction positions
  max_lot_gold: 0.02              # Strict lot cap for Gold
  max_lot_btc: 0.03               # Dedicated lot capacity for BTC_8H (0.01 - 0.03 BTC)
  max_lot_fx: 0.04                # Calibrated lot cap for FX (0.02 - 0.04 lot)

# ---------------------------------------------------------------------
# CARVER SYSTEMATIC PORTFOLIO ALLOCATION (CORE-SATELLITE MODEL)
# ---------------------------------------------------------------------
carver_portfolio:
  enabled: true
  annual_target_vol_pct: 16.0     # Target portfolio annualized volatility (16%)
  idm: 1.42                       # Instrument Diversification Multiplier
  buffer_fraction: 0.10           # 10% Position buffer to eliminate spread/churn bleed
  weights:
    btc_8h: 0.55                  # Core Alpha Engine: 55% Capital Allocation (Top Performer)
    fx_d1: 0.30                   # Stable Trend Defender: 30% Capital Allocation (5 FX Majors)
    gold_sess: 0.15               # Selective Session Satellite: 15% (Asian Breakout Filtered)
    usidx_sess: 0.00              # US Indices Satellite: 0% (Standby)
    nowtrading_mtf: 0.00          # M15 Churn Bot: 0% (ISOLATED / DISABLED)

bots:
  # -------------------------------------------------------------------
  # BOT 1: Bitcoin 8-Hour Strategy (BTCUSD)
  # -------------------------------------------------------------------
  btc_8h:
    enabled: true
    magic: 260904
    symbol: "BTCUSDm"
    cadence_hours: 8              # Runs at 00:00, 08:00, 16:00 UTC
    decision_utc_hours: [0, 8, 16]
    sizing_mode: "dynamic_risk"    # Dynamic ATR risk sizing
    risk_per_trade_pct: 0.50      # ~0.50% equity risk (~$50/trade on $10k equity)
    base_lot: 0.01
    min_lot: 0.01
    max_lot: 0.04                 # Hard ceiling max_lot_btc: 0.04
    sl_atr_multiplier: 2.0
    tp_atr_multiplier: 3.0
    spread_limit_points: 2000

  # -------------------------------------------------------------------
  # BOT 2: Forex Daily Close Strategy (FX Majors)
  # -------------------------------------------------------------------
  fx_d1:
    enabled: true
    magic: 260901
    symbols:
      - "EURUSDm"
      - "GBPUSDm"
      - "USDJPYm"
      - "AUDUSDm"
      - "USDCADm"
    decision_utc_hour: 20          # 20:00 UTC (Server daily candle close / rollover)
    decision_weekdays: [1, 2, 3, 4, 5] # Tue-Sat morning UTC
    sizing_mode: "dynamic_risk"    # Dynamic ATR risk sizing
    risk_per_trade_pct: 0.40      # ~0.40% equity risk (~$40/trade on $10k equity)
    base_lot: 0.02
    min_lot: 0.01
    max_lot: 0.06                 # Hard ceiling max_lot_fx: 0.06
    sl_atr_multiplier: 1.5
    tp_atr_multiplier: 2.5
    spread_limit_points: 50

  # -------------------------------------------------------------------
  # BOT 3: Gold & Silver Session Strategy (London & NY Sessions)
  # -------------------------------------------------------------------
  gold_sess:
    enabled: true
    hourly_mode: false             # Chi quét 2 phiên lon London (08:00 UTC) va New York (13:00 UTC) chong whipsaw
    magic: 260903
    symbols:
      - "XAUUSDm"
    sessions:
      london:
        utc_hour: 8                # 08:00 UTC (London session start)
      new_york:
        utc_hour: 13               # 13:00 UTC (New York session start)
    use_asian_breakout_filter: true # Bo loc breakout bien do phien A (00:00 - 07:00 UTC) chong rang co
    atr_expansion_filter: true     # Chi vao lenh khi ATR14 > Trung binh ATR20 (thi truong co song thuc su)
    sizing_mode: "dynamic_risk"    # Dynamic ATR risk sizing
    risk_per_trade_pct: 0.50      # ~0.50% equity risk
    breakeven_trigger_atr: 1.0     # Khoá Breakeven sớm tại 1.0 ATR
    half_kelly_multiplier: 1.00    # Full sizing per risk target
    base_lot: 0.01
    min_lot: 0.01
    max_lot: 0.04                  # Hard ceiling max_lot_gold: 0.04
    sl_atr_multiplier: 1.5         # SL dong theo ATR
    tp_atr_multiplier: 2.5         # TP dong theo ATR (2.5R)
    spread_limit_points: 350

  # -------------------------------------------------------------------
  # BOT 4: US Indices Session Strategy (US500 & USTEC)
  # -------------------------------------------------------------------
  usidx_sess:
    enabled: false                # Standby / 0% Carver allocation
    magic: 260902
    symbols:
      - "US500m"
      - "USTECm"
    sessions:
      cash_open:
        utc_hour: 14               # 14:30 UTC rounded to 14:00/15:00
      cash_close:
        utc_hour: 20               # 20:00/21:00 UTC
    base_lot: 0.01
    max_lot: 0.02
    sl_atr_multiplier: 1.5
    tp_atr_multiplier: 2.0
    spread_limit_points: 500

  # -------------------------------------------------------------------
  # BOT 5: NowTrading 2.1 Multi-Timeframe Strategy (RSI + ADX + ATR DCA)
  # -------------------------------------------------------------------
  nowtrading_mtf:
    enabled: false                 # Tam thoi co lap / scale-down tren M15 de tinh chinh giam tan suat lenh rac
    scale_down: true
    magic: 260905
    legacy_magic: 202500           # Also tracks legacy open positions
    symbols:
      - "XAUUSDm"
      - "EURUSDm"
    base_lots:
      FX: 0.01
      GOLD: 0.01
      CRYPTO: 0.01
      INDEX: 0.01
    max_lot: 0.02
    rsi_period: 14
    rsi_buy_threshold: 58.0        # Tang nguong loc tu 53.0 len 58.0 tranh nhieu
    rsi_sell_threshold: 42.0       # Ha nguong loc tu 47.0 xuong 42.0 tranh nhieu
    rsi_pullback_threshold: 50.0
    adx_period: 14
    adx_trend_threshold: 22.0
    atr_period: 14
    use_dynamic_atr_tp: true       # Chuyen TP sang dong theo ATR (2.5x ATR) thay vi co dinh $5.00
    tp_atr_multiplier: 2.5
    sl_atr_multiplier: 1.5
    max_dca_layers: 0
    profit_target_usd: 5.0
    holding_max_hours: 24
    holding_reduce_hours: 12
